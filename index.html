<html>
<head>
    <title>Launcher</title>
    <link rel="icon" type="image/x-icon" href="home.png">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #1d2021;
            color: #ebdbb2;
            padding: 2vh 2vw;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .grid {
            width: 100%;
            height: 100%;

            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(120px, 1fr)
            );
            grid-auto-rows: 1fr;
            gap: 1vw;

            max-width: 1400px;
            max-height: 700px;
        }

        a {
            color: #83a598;
            text-decoration: none;
            background-color: #3c3836;
            border-radius: 8px;

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;

            padding: 10px;
            font-size: clamp(1rem, 2vw, 2rem);

            aspect-ratio: 1 / 1;
        }

        a:hover {
            color: #b8bb26;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="grid">
        <a href="https://clever.com/in/hisd">Clever</a>
        <a href="https://samlidp.clever.com/saml-canvas/signon">Canvas</a>
        <a href="https://quest.cns.utexas.edu/student/">Quest</a>
        <a href="https://drive.google.com/drive/folders/1Y-6G747RL9yPCxo6dtTeRGH7fniO4-L0?usp=drive_link">Precal BC Drive</a>

        <a href="https://calendar.google.com/calendar/">Google Calendar</a>
        <a href="https://houstonisd-my.sharepoint.com/personal/kdavis12_houstonisd_org/_layouts/15/Doc.aspx?sourcedoc={c182b46a-f501-40b1-8a2e-12b4dcebbc8e}&action=view&wd=target%28WHAP%20Headers%20for%20Notes.one%7C26c1c29d-d335-43e6-bf79-5056daa7fbb1%2F8%5C%2F10-20%20Chapter%201%7C380b4fd8-4c6d-4e53-93c2-ddeb3c976f7c%2F%29&wdorigin=NavigationUrl">WHAP Notes</a>
        <a href="https://myap.collegeboard.org">AP Classroom</a>
    </div>
</body>
</html>
