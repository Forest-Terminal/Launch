<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Launcher</title>
    <link rel="icon" type="image/x-icon" href="home.png">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: #1d2021;
            color: #ebdbb2;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 1.3rem;
            overflow: hidden;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;

            /*
             * The grid is 3 columns × 3 rows.
             * Calculate its maximum size from the viewport.
             */
            width: min(
                90vw,
                calc((90vh - 1rem) / 3 * 3)
            );
        }

        a {
            aspect-ratio: 1 / 1;

            width: 100%;

            border-radius: 8px;
            background-color: #3c3836;

            color: #83a598;
            text-decoration: none;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
            padding: 0.5rem;

            font-size: clamp(1rem, 3vw, 2rem);

            transition:
                color 0.15s ease,
                background-color 0.15s ease;
        }

        a:hover {
            color: #b8bb26;
            text-decoration: underline;
            background-color: #504945;
        }
    </style>
</head>

<body>

    <div class="grid">

           target="_blank"
           rel="noopener noreferrer">

        </a>

           target="_blank"

        </a>
